<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Солнечная система — 3D Симуляция</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #020409;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Панель в стиле Apple iOS Glassmorphism */
        .ios-glass-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 340px;
            padding: 22px 24px;
            border-radius: 24px;
            background: rgba(22, 27, 38, 0.52);
            backdrop-filter: blur(24px) saturate(185%);
            -webkit-backdrop-filter: blur(24px) saturate(185%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .panel-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #a5c4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(52, 199, 89, 0.18);
            color: #4cd964;
            border: 1px solid rgba(76, 217, 100, 0.3);
        }

        .status-badge.paused {
            background: rgba(255, 159, 10, 0.18);
            color: #ff9f0a;
            border-color: rgba(255, 159, 10, 0.3);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .panel-desc {
            font-size: 13.5px;
            line-height: 1.5;
            color: rgba(235, 240, 255, 0.76);
            margin-bottom: 18px;
        }

        /* Кнопка Пауза / Продолжить */
        .primary-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: linear-gradient(135deg, rgba(10, 132, 255, 0.85) 0%, rgba(0, 85, 212, 0.85) 100%);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(10, 132, 255, 0.35);
            transition: all 0.2s ease;
        }

        .primary-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, rgba(30, 148, 255, 0.95) 0%, rgba(10, 102, 235, 0.95) 100%);
            box-shadow: 0 10px 24px rgba(10, 132, 255, 0.5);
        }

        .primary-btn:active {
            transform: translateY(1px) scale(0.99);
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 16px 0;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.48);
            margin-bottom: 10px;
        }

        /* Кнопки быстрого наведения камеры на планеты */
        .camera-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .pill-btn {
            flex: 1 1 calc(33.33% - 6px);
            padding: 7px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.85);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.18s ease;
        }

        .pill-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .pill-btn.active {
            background: rgba(255, 255, 255, 0.92);
            color: #0b101e;
            font-weight: 600;
            border-color: #fff;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.22);
        }

        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 12.5px;
            color: rgba(235, 240, 255, 0.8);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 150px;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        .controls-hint {
            margin-top: 14px;
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
        }
    </style>

    <!-- Подключение Three.js и OrbitControls через CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- Панель управления в стиле iOS -->
    <div class="ios-glass-panel">
        <div class="panel-header">
            <h1 class="panel-title">Солнечная система</h1>
            <div id="status-badge" class="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">В движении</span>
            </div>
        </div>
        <p class="panel-desc">
            Интерактивная 3D-модель с динамической сменой дня и ночи на Земле, ночными огнями городов, облачным слоем и атмосферным свечением.
        </p>

        <button id="toggle-play-btn" class="primary-btn">
            <span id="btn-icon">⏸</span>
            <span id="btn-label">Пауза / Продолжить</span>
        </button>

        <div class="divider"></div>

        <div class="section-label">Фокус камеры</div>
        <div class="camera-pills" id="camera-targets">
            <button class="pill-btn" data-target="overview">Обзор</button>
            <button class="pill-btn" data-target="sun">Солнце</button>
            <button class="pill-btn active" data-target="earth">Земля</button>
            <button class="pill-btn" data-target="mars">Марс</button>
            <button class="pill-btn" data-target="jupiter">Юпитер</button>
            <button class="pill-btn" data-target="saturn">Сатурн</button>
        </div>

        <div class="slider-row">
            <span>Скорость времени: <b id="speed-val">1.0x</b></span>
            <input id="speed-slider" type="range" min="0.1" max="3.5" step="0.1" value="1.0">
        </div>

        <div class="controls-hint">
            ЛКМ — вращение • Колесико — зум • ПКМ — панорама
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // 1. ИНИЦИАЛИЗАЦИЯ СЦЕНЫ, КАМЕРЫ И РЕНДЕРЕРА
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 4000);
        camera.position.set(42, 16, 48);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4.5;
        controls.maxDistance = 650;

        // ==========================================
        // 2. ОСВЕЩЕНИЕ СЦЕНЫ
        // ==========================================
        // Мощный точечный источник света в центре Солнца (decay = 0 для равномерного освещения далеких планет)
        const sunLight = new THREE.PointLight(0xfff6e5, 3.2, 0, 0);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // Мягкая фоновая подсветка глубокого космоса
        const ambientLight = new THREE.AmbientLight(0x182238, 0.35);
        scene.add(ambientLight);

        // ==========================================
        // 3. ЗВЕЗДНОЕ НЕБО (9 000 МЕРЦАЮЩИХ ЗВЕЗД)
        // ==========================================
        function createTwinklingStarfield() {
            const starCount = 9000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);
            const phases = new Float32Array(starCount);

            const palette = [
                new THREE.Color(0xcad8ff), // Голубой гигант
                new THREE.Color(0xffffff), // Белая звезда
                new THREE.Color(0xfff4d6), // Желто-белая
                new THREE.Color(0xffd2a1), // Оранжевая
                new THREE.Color(0xffb56c)  // Красный карлик
            ];

            for (let i = 0; i < starCount; i++) {
                // Равномерное распределение по сфере большого радиуса
                const r = 700 + Math.random() * 900;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                const color = palette[Math.floor(Math.random() * palette.length)];
                colors[i * 3]     = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                sizes[i] = 1.2 + Math.pow(Math.random(), 3) * 4.5;
                phases[i] = Math.random() * Math.PI * 2;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uPixelRatio: { value: renderer.getPixelRatio() }
                },
                vertexShader: `
                    attribute float aSize;
                    attribute float aPhase;
                    varying vec3 vColor;
                    varying float vTwinkle;
                    uniform float uTime;
                    uniform float uPixelRatio;

                    void main() {
                        vColor = color;
                        vTwinkle = 0.65 + 0.35 * sin(uTime * 2.8 + aPhase);
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = aSize * uPixelRatio * vTwinkle * (500.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vTwinkle;

                    void main() {
                        float dist = length(gl_PointCoord - vec2(0.5));
                        if (dist > 0.5) discard;
                        float core = smoothstep(0.5, 0.02, dist);
                        gl_FragColor = vec4(vColor * (0.9 + 0.4 * vTwinkle), core);
                    }
                `,
                transparent: true,
                vertexColors: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
            return material;
        }

        const starMaterial = createTwinklingStarfield();

        // ==========================================
        // 4. СОЛНЦЕ С АНИМИРОВАННОЙ ПЛАЗМОЙ И КОРОНОЙ
        // ==========================================
        const sunGroup = new THREE.Group();
        scene.add(sunGroup);

        const sunShaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec3 vViewPosition;

                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    vViewPosition = -mvPosition.xyz;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec3 vViewPosition;
                uniform float uTime;

                // Быстрый 3D-шум для солнечной конвекции
                float hash(vec3 p) {
                    p = fract(p * 0.3183099 + 0.1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }

                float noise(vec3 x) {
                    vec3 i = floor(x);
                    vec3 f = fract(x);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                            mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                        mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                            mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z
                    );
                }

                float fbm(vec3 p) {
                    float v = 0.0;
                    float a = 0.5;
                    for (int i = 0; i < 5; i++) {
                        v += a * noise(p);
                        p = p * 2.05 + vec3(uTime * 0.12);
                        a *= 0.5;
                    }
                    return v;
                }

                void main() {
                    vec3 p = normalize(vPosition) * 3.8;
                    float n = fbm(p + vec3(0.0, uTime * 0.15, 0.0));
                    float n2 = fbm(p * 2.2 - vec3(uTime * 0.2));
                    float plasma = clamp(n * 0.65 + n2 * 0.5, 0.0, 1.0);

                    vec3 darkSpot = vec3(0.75, 0.15, 0.02);
                    vec3 midOrange = vec3(1.0, 0.48, 0.05);
                    vec3 brightYellow = vec3(1.0, 0.92, 0.55);
                    vec3 hotWhite = vec3(1.3, 1.25, 1.1);

                    vec3 col = mix(darkSpot, midOrange, smoothstep(0.2, 0.5, plasma));
                    col = mix(col, brightYellow, smoothstep(0.48, 0.78, plasma));
                    col = mix(col, hotWhite, smoothstep(0.75, 0.98, plasma));

                    // Эффект потемнения/свечения к краю солнечного диска
                    vec3 viewDir = normalize(vViewPosition);
                    float fresnel = 1.0 - max(dot(vNormal, viewDir), 0.0);
                    col += vec3(1.0, 0.5, 0.1) * pow(fresnel, 2.5) * 0.9;

                    gl_FragColor = vec4(col, 1.0);
                }
            `
        });

        const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(8.5, 64, 64), sunShaderMaterial);
        sunGroup.add(sunMesh);

        // Создание текстуры солнечной короны (Glow Sprite)
        function createSunCoronaSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createRadialGradient(256, 256, 25, 256, 256, 256);
            grad.addColorStop(0.0, 'rgba(255, 250, 220, 1.0)');
            grad.addColorStop(0.22, 'rgba(255, 185, 70, 0.75)');
            grad.addColorStop(0.48, 'rgba(255, 100, 15, 0.28)');
            grad.addColorStop(0.75, 'rgba(180, 40, 5, 0.06)');
            grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);

            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({
                map: tex,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(42, 42, 1);
            return sprite;
        }

        sunGroup.add(createSunCoronaSprite());

        // ==========================================
        // 5. ФУНКЦИЯ СОЗДАНИЯ ТОНКИХ ЛИНИЙ ОРБИТ
        // ==========================================
        function createOrbitRing(radius, color = 0x5c85d6, opacity = 0.22) {
            const segments = 256;
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: opacity,
                depthWrite: false
            });
            return new THREE.LineLoop(geometry, material);
        }

        // ==========================================
        // 6. ЗАГРУЗКА ТЕКСТУР ЗЕМЛИ И ЛУНЫ С CDN
        // ==========================================
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        const BASE_URL = 'https://threejs.org/examples/textures/planets/';
        const FALLBACK_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/';

        function loadPlanetTexture(filename, isSRGB = true) {
            const tex = textureLoader.load(
                BASE_URL + filename,
                undefined,
                undefined,
                () => {
                    // Автоматический резервный CDN, если прямой доступ ограничен
                    textureLoader.load(FALLBACK_URL + filename, (fallbackTex) => {
                        tex.image = fallbackTex.image;
                        tex.needsUpdate = true;
                    });
                }
            );
            if (isSRGB) tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        const earthDayTex      = loadPlanetTexture('earth_atmos_2048.jpg', true);
        const earthNightTex    = loadPlanetTexture('earth_lights_2048.png', true);
        const earthNormalTex   = loadPlanetTexture('earth_normal_2048.jpg', false);
        const earthSpecularTex = loadPlanetTexture('earth_specular_2048.jpg', false);
        const earthCloudsTex   = loadPlanetTexture('earth_clouds_1024.png', true);
        const moonTex          = loadPlanetTexture('moon_1024.jpg', true);

        // ==========================================
        // 7. ЗЕМЛЯ (ДЕНЬ + НОЧНЫЕ ОГНИ + ОБЛАКА + АТМОСФЕРА) + ЛУНА
        // ==========================================
        const EARTH_ORBIT_RADIUS = 38;
        scene.add(createOrbitRing(EARTH_ORBIT_RADIUS, 0x4da6ff, 0.28));

        // Узел орбиты Земли
        const earthOrbitNode = new THREE.Group();
        earthOrbitNode.position.set(EARTH_ORBIT_RADIUS, 0, 0);
        scene.add(earthOrbitNode);

        // Наклон оси Земли (23.4 градуса)
        const earthTiltGroup = new THREE.Group();
        earthTiltGroup.rotation.z = THREE.MathUtils.degToRad(23.4);
        earthOrbitNode.add(earthTiltGroup);

        // Кастомный шейдер Земли: смешивает карту дня, карту ночных городов, рельеф и блик океанов
        const earthMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uDayTexture:      { value: earthDayTex },
                uNightTexture:    { value: earthNightTex },
                uNormalMap:       { value: earthNormalTex },
                uSpecularMap:     { value: earthSpecularTex },
                uCloudsMap:       { value: earthCloudsTex },
                uSunPosition:     { value: new THREE.Vector3(0, 0, 0) },
                uCloudOffset:     { value: 0.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vWorldNormal;
                varying vec3 vWorldPosition;

                void main() {
                    vUv = uv;
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    vWorldNormal = normalize(mat3(modelMatrix) * normal);
                    gl_Position = projectionMatrix * viewMatrix * worldPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D uDayTexture;
                uniform sampler2D uNightTexture;
                uniform sampler2D uNormalMap;
                uniform sampler2D uSpecularMap;
                uniform sampler2D uCloudsMap;
                uniform vec3 uSunPosition;
                uniform float uCloudOffset;

                varying vec2 vUv;
                varying vec3 vWorldNormal;
                varying vec3 vWorldPosition;

                void main() {
                    vec3 normal = normalize(vWorldNormal);
                    vec3 sunDir = normalize(uSunPosition - vWorldPosition);
                    vec3 viewDir = normalize(cameraPosition - vWorldPosition);

                    // Детализация нормали из карты рельефа
                    vec3 normalTex = texture2D(uNormalMap, vUv).xyz * 2.0 - 1.0;
                    normal = normalize(normal + normalTex * 0.22);

                    // Косинус угла падения солнечных лучей (-1 = полночь, +1 = полдень)
                    float sunOrientation = dot(normal, sunDir);

                    // Плавный переход терминатора между днем и ночью
                    float dayMix = smoothstep(-0.18, 0.25, sunOrientation);
                    float nightMix = 1.0 - smoothstep(-0.22, 0.08, sunOrientation);

                    vec3 dayColor = texture2D(uDayTexture, vUv).rgb;
                    vec3 nightLights = texture2D(uNightTexture, vUv).rgb;
                    float specMask = texture2D(uSpecularMap, vUv).r;

                    // Легкая тень от облаков на дневной поверхности
                    float cloudSample = texture2D(uCloudsMap, vec2(fract(vUv.x + uCloudOffset), vUv.y)).r;

                    // Освещение дневной стороны
                    float diffuse = max(sunOrientation, 0.0);
                    vec3 litDay = dayColor * (0.08 + diffuse * 1.15) * (1.0 - cloudSample * 0.35);

                    // Солнечный блик в океанах (по карте Specular)
                    vec3 halfVec = normalize(sunDir + viewDir);
                    float spec = pow(max(dot(normal, halfVec), 0.0), 42.0) * specMask * dayMix;
                    vec3 specularColor = vec3(1.0, 0.94, 0.82) * spec * 0.85;

                    // Золотистое свечение ночных городов (приглушается плотными облаками)
                    vec3 cityGlow = nightLights * vec3(1.35, 0.95, 0.55) * 1.9 * nightMix * (1.0 - cloudSample * 0.65);
                    vec3 darkSideBase = dayColor * 0.025 * (1.0 - dayMix);

                    // Атмосферное рассеяние на линии терминатора (багрово-оранжевый закат)
                    float twilight = smoothstep(-0.22, 0.02, sunOrientation) * (1.0 - smoothstep(0.02, 0.28, sunOrientation));
                    vec3 sunsetTint = vec3(0.95, 0.35, 0.12) * twilight * 0.38;

                    // Голубая дымка Френеля у края дневного диска
                    float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);
                    vec3 rimAtmosphere = vec3(0.28, 0.62, 1.0) * fresnel * (0.2 + 0.8 * dayMix);

                    vec3 finalColor = litDay * dayMix + darkSideBase + cityGlow + specularColor + sunsetTint + rimAtmosphere;
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        const EARTH_RADIUS = 2.6;
        const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS, 64, 64), earthMaterial);
        earthTiltGroup.add(earthMesh);

        // Слой облаков Земли (вращается чуть быстрее самой планеты)
        const cloudsMaterial = new THREE.MeshStandardMaterial({
            map: earthCloudsTex,
            transparent: true,
            opacity: 0.82,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const cloudsMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS * 1.016, 64, 64), cloudsMaterial);
        earthTiltGroup.add(cloudsMesh);

        // Внешнее свечение атмосферы Земли (Fresnel BackSide Glow)
        const atmosphereMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uSunPosition: { value: new THREE.Vector3(0, 0, 0) }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                void main() {
                    vNormal = normalize(mat3(modelMatrix) * normal);
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPos.xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPos;
                }
            `,
            fragmentShader: `
                uniform vec3 uSunPosition;
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                void main() {
                    vec3 viewDir = normalize(cameraPosition - vWorldPosition);
                    vec3 sunDir = normalize(uSunPosition - vWorldPosition);
                    float sunFactor = smoothstep(-0.35, 0.5, dot(vNormal, sunDir));
                    float intensity = pow(0.65 - dot(-vNormal, viewDir), 2.8);
                    vec3 glowColor = vec3(0.25, 0.65, 1.0) * intensity * (0.25 + 0.85 * sunFactor);
                    gl_FragColor = vec4(glowColor, intensity * 0.85);
                }
            `,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        const atmosphereMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS * 1.14, 64, 64), atmosphereMaterial);
        earthTiltGroup.add(atmosphereMesh);

        // ЛУНА И ЕЁ ОРБИТА ВОКРУГ ЗЕМЛИ
        const MOON_ORBIT_RADIUS = 6.2;
        const moonOrbitContainer = new THREE.Group();
        moonOrbitContainer.rotation.x = THREE.MathUtils.degToRad(5.1);
        earthOrbitNode.add(moonOrbitContainer);

        moonOrbitContainer.add(createOrbitRing(MOON_ORBIT_RADIUS, 0x99aabb, 0.25));

        const moonPivot = new THREE.Group();
        moonOrbitContainer.add(moonPivot);

        const moonMaterial = new THREE.MeshStandardMaterial({
            map: moonTex,
            bumpMap: moonTex,
            bumpScale: 0.04,
            roughness: 0.88,
            metalness: 0.05
        });
        const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.68, 48, 48), moonMaterial);
        moonMesh.position.set(MOON_ORBIT_RADIUS, 0, 0);
        moonPivot.add(moonMesh);

        // ==========================================
        // 8. ПРОЦЕДУРНЫЕ 2K-ТЕКСТУРЫ ДЛЯ МАРСА, ЮПИТЕРА И САТУРНА
        // ==========================================
        function createMarsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const img = ctx.createImageData(canvas.width, canvas.height);
            const d = img.data;

            for (let y = 0; y < canvas.height; y++) {
                const v = y / canvas.height;
                const lat = Math.abs(v - 0.5) * 2; // 0 на экваторе, 1 на полюсах

                for (let x = 0; x < canvas.width; x++) {
                    const u = x / canvas.width;
                    const idx = (y * canvas.width + x) * 4;

                    // Псевдо-фрактальный рельеф Марса
                    const n1 = Math.sin(u * Math.PI * 6) * Math.cos(v * Math.PI * 5);
                    const n2 = Math.sin(u * Math.PI * 18 + 1.4) * Math.sin(v * Math.PI * 14);
                    const n3 = Math.cos((u + v) * Math.PI * 36) * 0.35;
                    const terrain = n1 * 0.5 + n2 * 0.35 + n3 * 0.25;

                    let r = 192 + terrain * 38;
                    let g = 88 + terrain * 26;
                    let b = 46 + terrain * 16;

                    // Полярные ледяные шапки Марса
                    if (lat > 0.86 + n2 * 0.04) {
                        const ice = Math.min(1, (lat - 0.84) * 9);
                        r = r * (1 - ice) + 242 * ice;
                        g = g * (1 - ice) + 238 * ice;
                        b = b * (1 - ice) + 235 * ice;
                    }

                    d[idx]     = Math.max(0, Math.min(255, r));
                    d[idx + 1] = Math.max(0, Math.min(255, g));
                    d[idx + 2] = Math.max(0, Math.min(255, b));
                    d[idx + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createJupiterTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const img = ctx.createImageData(canvas.width, canvas.height);
            const d = img.data;

            for (let y = 0; y < canvas.height; y++) {
                const v = y / canvas.height;
                for (let x = 0; x < canvas.width; x++) {
                    const u = x / canvas.width;
                    const idx = (y * canvas.width + x) * 4;

                    // Турбулентные зональные пояса Юпитера
                    const swirl = Math.sin(u * Math.PI * 10 + Math.sin(v * Math.PI * 18) * 1.5) * 0.015;
                    const bandCoord = (v + swirl) * Math.PI * 14;
                    const band = Math.sin(bandCoord) * 0.5 + Math.cos(bandCoord * 1.7) * 0.5;

                    let r = 205 + band * 35;
                    let g = 165 + band * 42;
                    let b = 122 + band * 38;

                    // Большое красное пятно (Great Red Spot)
                    const dx = (u - 0.58) * 3.2;
                    const dy = (v - 0.64) * 7.5;
                    const distSpot = Math.hypot(dx, dy);
                    if (distSpot < 0.35) {
                        const spotFactor = Math.cos((distSpot / 0.35) * Math.PI * 0.5);
                        r = r * (1 - spotFactor) + 215 * spotFactor;
                        g = g * (1 - spotFactor) + 78 * spotFactor;
                        b = b * (1 - spotFactor) + 45 * spotFactor;
                    }

                    d[idx]     = Math.max(0, Math.min(255, r));
                    d[idx + 1] = Math.max(0, Math.min(255, g));
                    d[idx + 2] = Math.max(0, Math.min(255, b));
                    d[idx + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createSaturnTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const img = ctx.createImageData(canvas.width, canvas.height);
            const d = img.data;

            for (let y = 0; y < canvas.height; y++) {
                const v = y / canvas.height;
                const band = Math.sin(v * Math.PI * 16) * 0.4 + Math.cos(v * Math.PI * 7) * 0.6;
                for (let x = 0; x < canvas.width; x++) {
                    const u = x / canvas.width;
                    const idx = (y * canvas.width + x) * 4;
                    const subtleWave = Math.sin(u * Math.PI * 8 + v * 20) * 4;

                    d[idx]     = Math.max(0, Math.min(255, 224 + band * 22 + subtleWave));
                    d[idx + 1] = Math.max(0, Math.min(255, 194 + band * 24 + subtleWave));
                    d[idx + 2] = Math.max(0, Math.min(255, 138 + band * 20 + subtleWave));
                    d[idx + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createSaturnRingsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const img = ctx.createImageData(canvas.width, canvas.height);
            const d = img.data;

            for (let x = 0; x < canvas.width; x++) {
                const t = x / canvas.width; // 0 = внутренний край, 1 = внешний край

                // Структура колец C, B, щели Кассини и кольца A
                const fineRings = Math.sin(t * 240) * 0.15 + Math.cos(t * 95) * 0.2;
                let alpha = 0.78 + fineRings;

                // Внутреннее полупрозрачное кольцо C
                if (t < 0.22) alpha *= (t / 0.22) * 0.55;
                // Щель Кассини (темный промежуток между кольцами B и A)
                if (t > 0.62 && t < 0.68) alpha *= 0.08;
                // Деление Энке у внешнего края
                if (t > 0.88 && t < 0.90) alpha *= 0.2;
                // Мягкое затухание на границах
                if (t > 0.95) alpha *= (1 - t) / 0.05;

                const r = 228 + Math.sin(t * 60) * 18;
                const g = 202 + Math.sin(t * 60) * 16;
                const b = 160 + Math.cos(t * 45) * 15;

                for (let y = 0; y < canvas.height; y++) {
                    const idx = (y * canvas.width + x) * 4;
                    d[idx]     = r;
                    d[idx + 1] = g;
                    d[idx + 2] = b;
                    d[idx + 3] = Math.max(0, Math.min(255, alpha * 235));
                }
            }
            ctx.putImageData(img, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // ==========================================
        // 9. СОЗДАНИЕ МАРСА, ЮПИТЕРА И САТУРНА С КОЛЬЦАМИ
        // ==========================================
        // МАРС
        const MARS_ORBIT_RADIUS = 58;
        scene.add(createOrbitRing(MARS_ORBIT_RADIUS, 0xe06b43, 0.22));
        const marsOrbitNode = new THREE.Group();
        scene.add(marsOrbitNode);

        const marsTex = createMarsTexture();
        const marsMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.65, 48, 48),
            new THREE.MeshStandardMaterial({
                map: marsTex,
                bumpMap: marsTex,
                bumpScale: 0.03,
                roughness: 0.82
            })
        );
        marsMesh.rotation.z = THREE.MathUtils.degToRad(25.2);
        marsOrbitNode.add(marsMesh);

        // ЮПИТЕР
        const JUPITER_ORBIT_RADIUS = 92;
        scene.add(createOrbitRing(JUPITER_ORBIT_RADIUS, 0xd9a873, 0.22));
        const jupiterOrbitNode = new THREE.Group();
        scene.add(jupiterOrbitNode);

        const jupiterMesh = new THREE.Mesh(
            new THREE.SphereGeometry(5.6, 64, 64),
            new THREE.MeshStandardMaterial({
                map: createJupiterTexture(),
                roughness: 0.65,
                metalness: 0.05
            })
        );
        jupiterMesh.rotation.z = THREE.MathUtils.degToRad(3.1);
        jupiterOrbitNode.add(jupiterMesh);

        // САТУРН И ЕГО КОЛЬЦА
        const SATURN_ORBIT_RADIUS = 136;
        scene.add(createOrbitRing(SATURN_ORBIT_RADIUS, 0xe5c98b, 0.22));
        const saturnOrbitNode = new THREE.Group();
        scene.add(saturnOrbitNode);

        const saturnTiltGroup = new THREE.Group();
        saturnTiltGroup.rotation.z = THREE.MathUtils.degToRad(26.7);
        saturnTiltGroup.rotation.x = THREE.MathUtils.degToRad(8.0);
        saturnOrbitNode.add(saturnTiltGroup);

        const saturnMesh = new THREE.Mesh(
            new THREE.SphereGeometry(4.6, 64, 64),
            new THREE.MeshStandardMaterial({
                map: createSaturnTexture(),
                roughness: 0.7
            })
        );
        saturnTiltGroup.add(saturnMesh);

        // Радиальная геометрия колец Сатурна с корректной UV-разверткой
        const innerRingR = 5.8;
        const outerRingR = 11.4;
        const ringGeo = new THREE.RingGeometry(innerRingR, outerRingR, 128);
        const posAttr = ringGeo.attributes.position;
        const uvAttr = ringGeo.attributes.uv;
        const v3 = new THREE.Vector3();

        for (let i = 0; i < posAttr.count; i++) {
            v3.fromBufferAttribute(posAttr, i);
            const radiusNorm = (v3.length() - innerRingR) / (outerRingR - innerRingR);
            uvAttr.setXY(i, radiusNorm, 0.5);
        }

        const saturnRingsMesh = new THREE.Mesh(
            ringGeo,
            new THREE.MeshStandardMaterial({
                map: createSaturnRingsTexture(),
                side: THREE.DoubleSide,
                transparent: true,
                roughness: 0.6,
                depthWrite: false
            })
        );
        saturnRingsMesh.rotation.x = Math.PI / 2;
        saturnTiltGroup.add(saturnRingsMesh);

        // ==========================================
        // 10. УПРАВЛЕНИЕ UI И КАМЕРОЙ
        // ==========================================
        let isPaused = false;
        let speedMultiplier = 1.0;
        let activeTarget = 'earth';

        const togglePlayBtn = document.getElementById('toggle-play-btn');
        const btnIcon       = document.getElementById('btn-icon');
        const statusBadge   = document.getElementById('status-badge');
        const statusText    = document.getElementById('status-text');
        const speedSlider   = document.getElementById('speed-slider');
        const speedVal      = document.getElementById('speed-val');
        const targetButtons = document.querySelectorAll('.pill-btn');

        togglePlayBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
                btnIcon.textContent = '▶';
                statusBadge.classList.add('paused');
                statusText.textContent = 'На паузе';
            } else {
                btnIcon.textContent = '⏸';
                statusBadge.classList.remove('paused');
                statusText.textContent = 'В движении';
            }
        });

        speedSlider.addEventListener('input', (e) => {
            speedMultiplier = parseFloat(e.target.value);
            speedVal.textContent = speedMultiplier.toFixed(1) + 'x';
        });

        // Плавный перевод фокуса камеры на выбранную планету
        const targetCameraOffsets = {
            overview: new THREE.Vector3(0, 95, 185),
            sun:      new THREE.Vector3(0, 10, 28),
            earth:    new THREE.Vector3(6.5, 2.6, 7.5),
            mars:     new THREE.Vector3(4.5, 1.8, 5.2),
            jupiter:  new THREE.Vector3(13, 5, 15),
            saturn:   new THREE.Vector3(16, 7, 19)
        };

        let shouldSnapOffset = true;

        targetButtons.forEach((btn) => {
            btn.addEventListener('click', () => {
                targetButtons.forEach((b) => b.classList.remove('active'));
                btn.classList.add('active');
                activeTarget = btn.dataset.target;
                shouldSnapOffset = true;
            });
        });

        // Начальные углы планет на орбитах
        const angles = {
            earth:   0.6,
            moon:    1.2,
            mars:    2.1,
            jupiter: 3.8,
            saturn:  5.1
        };

        function getTargetWorldPosition(targetName) {
            switch (targetName) {
                case 'earth':   return earthOrbitNode.position;
                case 'mars':    return marsOrbitNode.position;
                case 'jupiter': return jupiterOrbitNode.position;
                case 'saturn':  return saturnOrbitNode.position;
                default:        return sunGroup.position;
            }
        }

        // Отслеживаем положение выбранной планеты, чтобы камера летела вместе с ней
        const previousTargetPos = new THREE.Vector3().copy(earthOrbitNode.position);

        // ==========================================
        // 11. ГЛАВНЫЙ ЦИКЛ АНИМАЦИИ
        // ==========================================
        const clock = new THREE.Clock();
        let elapsedSimTime = 0;

        function updatePlanetPositions() {
            earthOrbitNode.position.set(
                Math.cos(angles.earth) * EARTH_ORBIT_RADIUS,
                0,
                Math.sin(angles.earth) * EARTH_ORBIT_RADIUS
            );
            marsOrbitNode.position.set(
                Math.cos(angles.mars) * MARS_ORBIT_RADIUS,
                0,
                Math.sin(angles.mars) * MARS_ORBIT_RADIUS
            );
            jupiterOrbitNode.position.set(
                Math.cos(angles.jupiter) * JUPITER_ORBIT_RADIUS,
                0,
                Math.sin(angles.jupiter) * JUPITER_ORBIT_RADIUS
            );
            saturnOrbitNode.position.set(
                Math.cos(angles.saturn) * SATURN_ORBIT_RADIUS,
                0,
                Math.sin(angles.saturn) * SATURN_ORBIT_RADIUS
            );
        }

        updatePlanetPositions();
        previousTargetPos.copy(getTargetWorldPosition(activeTarget));

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const realTime = clock.getElapsedTime();

            // Мерцание звезд и кипение солнечной плазмы работают всегда
            starMaterial.uniforms.uTime.value = realTime;
            sunShaderMaterial.uniforms.uTime.value = realTime;

            if (!isPaused) {
                const dt = delta * speedMultiplier;
                elapsedSimTime += dt;

                // Движение планет по орбитам вокруг Солнца
                angles.earth   += dt * 0.22;
                angles.moon    += dt * 1.45;
                angles.mars    += dt * 0.14;
                angles.jupiter += dt * 0.075;
                angles.saturn  += dt * 0.045;

                updatePlanetPositions();

                // Суточное вращение планет и облаков
                sunMesh.rotation.y     += dt * 0.08;
                earthMesh.rotation.y   += dt * 0.65;
                cloudsMesh.rotation.y  += dt * 0.82; // Облака движутся чуть быстрее самой Земли
                moonPivot.rotation.y    = angles.moon;
                moonMesh.rotation.y    += dt * 0.35;
                marsMesh.rotation.y    += dt * 0.60;
                jupiterMesh.rotation.y += dt * 1.15;
                saturnMesh.rotation.y  += dt * 0.95;

                // Смещение облачной тени в шейдере Земли
                earthMaterial.uniforms.uCloudOffset.value = (elapsedSimTime * 0.025) % 1.0;
            }

            // Плавное сопровождение выбранной планеты камерой
            const currentTargetPos = getTargetWorldPosition(activeTarget);
            const targetDelta = new THREE.Vector3().subVectors(currentTargetPos, previousTargetPos);

            camera.position.add(targetDelta);
            controls.target.lerp(currentTargetPos, 0.12);

            if (shouldSnapOffset) {
                const desiredCamPos = currentTargetPos.clone().add(targetCameraOffsets[activeTarget]);
                camera.position.lerp(desiredCamPos, 0.08);
                if (camera.position.distanceTo(desiredCamPos) < 0.4) {
                    shouldSnapOffset = false;
                }
            }

            previousTargetPos.copy(currentTargetPos);

            controls.update();
            renderer.render(scene, camera);
        }

        // Отключаем автоматический доводчик дистанции при ручном вращении мышью
        renderer.domElement.addEventListener('pointerdown', () => {
            shouldSnapOffset = false;
        });
        renderer.domElement.addEventListener('wheel', () => {
            shouldSnapOffset = false;
        });

        // Адаптация под изменение размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            starMaterial.uniforms.uPixelRatio.value = renderer.getPixelRatio();
        });

        animate();
    </script>
</body>
</html>
